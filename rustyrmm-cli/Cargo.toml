[package]
name = "rustyrmm-cli"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/mtelahun/rusty-rmm"
authors = ["Michael Telahun Makonnen"]
homepage = "https://github.com/mtelahun/rusty-rmm"
license = "BSD-2-Clause"
description = "RustyRMM Operator command-line interface"
keywords = ["grpc", "rmm", "cli"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "rustyrmm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive", "env"] }
dirs = "7.0.0"
prost-types = "0.14"
rpassword = "7.5.5"
rustyrmm-proto = { path = "../rustyrmm-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "io-util", "io-std"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
uuid = "1.29.3"

[dev-dependencies]
rcgen = "0.14.10"
rustyrmm-agent = { path = "../rustyrmm-agent" }
rustyrmm-server = { path = "../rustyrmm-server" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
tempfile = "3.27.0"
