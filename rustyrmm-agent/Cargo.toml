[package]
name = "rustyrmm-agent"
version = "0.2.5"
edition = "2021"
repository = "https://github.com/mtelahun/rusty-rmm"
authors = ["Michael Telahun Makonnen"]
homepage = "https://github.com/mtelahun/rusty-rmm"
license = "BSD-2-Clause"
description = "RustyRMM agent"
keywords = ["grpc", "network", "client"]
categories = ["os"]
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "6F21C627-3CAC-4EB2-95BC-6508D1A9A7B3"
path-guid = "0B1EC544-C572-4268-82D5-6E81BF53B68E"
license = false
eula = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
hex = "0.4.3"
iana-time-zone = "0.1.65"
pem = "4.0.0"
prost-types = "0.14"
rand = "0.10.4"
rcgen = { version = "0.14.10", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustyrmm-proto = {path = "../rustyrmm-proto"}
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.4"
tokio = { version = "1.33.0", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14", features = ["tls-ring"] }
x509-parser = "0.18.1"

[dev-dependencies]
prost = "0.14"
chrono = "0.4.45"
rustyrmm-server = { path = "../rustyrmm-server" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
tempfile = "3.27.0"
uuid = "1.29.3"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = "11.6.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
