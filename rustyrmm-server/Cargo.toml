[package]
name = "rustyrmm-server"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/mtelahun/rusty-rmm"
authors = ["Michael Telahun Makonnen"]
homepage = "https://github.com/mtelahun/rusty-rmm"
license = "BSD-2-Clause"
description = "RustyRMM server daemon"
keywords = ["grpc", "network", "server"]
categories = ["os"]
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "D64353A9-640B-4B56-AC83-D92E65A72605"
path-guid = "55BD66B4-393D-4F83-B454-23E20F7334E6"
license = false
eula = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
rpassword = "7.5.5"
rustyrmm-proto = {path = "../rustyrmm-proto"}
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.33.0", features = ["macros", "rt-multi-thread"] }
tonic = "0.14"
uuid = { version = "1.29.3", features = ["v7"] }
