[package]
name = "rustyrmm-server"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/mtelahun/rusty-rmm"
authors = ["Michael Telahun Makonnen"]
homepage = "https://github.com/mtelahun/rusty-rmm"
license = "BSD-2-Clause"
description = "RustyRMM server daemon"
keywords = ["grpc", "network", "server"]
categories = ["os"]
readme = "README.md"

[package.metadata.wix]
upgrade-guid = "D64353A9-640B-4B56-AC83-D92E65A72605"
path-guid = "55BD66B4-393D-4F83-B454-23E20F7334E6"
license = false
eula = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
hex = "0.4.3"
pem = "4.0.0"
prost = "0.14"
prost-types = "0.14"
rand = "0.10.4"
rcgen = { version = "0.14.10", features = ["x509-parser", "pem"] }
rpassword = "7.5.5"
rustyrmm-proto = {path = "../rustyrmm-proto"}
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "macros"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.33.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-web = "0.14"
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1.29.3", features = ["v7"] }
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
